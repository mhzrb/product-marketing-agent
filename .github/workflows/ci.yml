name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: product-marketing-agent:ci
      - name: Smoke test the container
        run: |
          docker run -d --name pma -p 8000:8000 product-marketing-agent:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | grep '"status":"ok"'
          curl -fsS -X POST http://127.0.0.1:8000/api/generate \
            -H 'content-type: application/json' \
            -d '{"product":{"name":"Test Laptop","category":"Laptop","specs":{"RAM":"16 GB"},"price":999}}' \
            | grep -E '"status":"(passed|failed)"'
