[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-marketing-agent"
version = "0.1.0"
description = "LLM agent that turns structured product data into verified EN/NL marketing copy (plan, draft, evaluate, revise)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2>=2.13",  # recent Starlette TestClient prefers httpx2 (httpx still works but warns)
    "ruff>=0.5",
]

[project.scripts]
pma = "pma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pma = ["prompts/**/*.md", "rag/guidelines/*.md", "data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["pma"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["pma"]

[tool.ruff.lint.per-file-ignores]
# canned template strings for the simulated model are intentionally long single lines
"src/pma/providers/simulated.py" = ["E501"]
"tests/**" = ["E501"]  # long literal strings in test data are clearer on one line
